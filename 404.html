<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Controle de Estoque</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            text-align: center;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 12px;
            font-size: 64px;
            color: #1e3a8a;
        }

        h2 {
            margin-bottom: 12px;
            font-size: 22px;
        }

        p {
            margin-bottom: 24px;
            line-height: 1.6;
            color: #6b7280;
        }

        a {
            display: inline-block;
            padding: 13px 24px;
            color: #ffffff;
            background: #1e3a8a;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }

        a:hover {
            background: #1e40af;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>404</h1>
        <h2>Página não encontrada</h2>

        <p>
            A página que você está procurando não existe
            ou pode ter sido movida.
        </p>

        <a href="index.html">Voltar ao início</a>
    </main>
</body>
</html>
