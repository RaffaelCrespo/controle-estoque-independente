
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Estoque - Demonstração</title>

    <!-- css -->
    <link rel="stylesheet" href="css/style.css">

    <!-- ícones -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- fonte google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="background">

        <div class="login-card">

            <!-- logo -->
            <div class="logo">
                <i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i>
            </div>

            <!-- título -->
            <h1>Controle de Estoque</h1>

            <h2>São José dos Pinhais</h2>

            <p class="descricao">
                Explore uma demonstração de um sistema para organização de estoque e armazenamento inteligente.
            </p>

            <!-- acesso à demonstração -->
            <form id="loginForm">

                <button type="submit" id="btnEntrar">

                    <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>

                    Acessar demonstração

                </button>

            </form>

            <!-- aviso -->
            <p class="descricao">
                Acesso gratuito, sem necessidade de cadastro.
            </p>

            <!-- rodapé -->
            <div class="footer">

                Desenvolvido por Raffael Crespo

                <br>

                Engenharia de Software • UNINTER

            </div>

        </div>

    </div>

    <!-- armazenamento local -->
    <script src="js/storage.js"></script>

    <!-- login -->
    <script src="js/login.js"></script>

</body>

</html>
